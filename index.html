<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rai Sport Live</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #000;
        display: block;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    controls="false">
</video>

<script>

const video = document.getElementById("video");

/*
   STREAM RAI SPORT
*/
const stream =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv";


function startVideo() {

    // Se il dispositivo supporta HLS nativamente
    if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = stream;

        video.play().catch(() => {
            setTimeout(() => {
                video.play().catch(() => {});
            }, 2000);
        });

    }

    // Chrome / Android / OptiSigns
    else if (Hls.isSupported()) {

        const hls = new Hls({
            autoStartLoad: true,
            startLevel: -1,
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 30
        });

        hls.loadSource(stream);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            video.muted = true;

            video.play().catch(() => {

                setTimeout(() => {
                    video.play().catch(() => {});
                }, 1000);

            });

        });

        hls.on(Hls.Events.ERROR, function(event, data) {

            console.log("HLS ERROR:", data);

            if (data.fatal) {

                setTimeout(() => {

                    try {
                        hls.destroy();
                    } catch(e) {}

                    startVideo();

                }, 5000);

            }

        });

    }

}


// Avvio
startVideo();


// Tentativi automatici di PLAY
setInterval(() => {

    if (video.paused) {
        video.muted = true;

        video.play().catch(() => {});
    }

}, 3000);


// Se il video si blocca, riparte
video.addEventListener("stalled", () => {

    setTimeout(() => {
        video.play().catch(() => {});
    }, 2000);

});


// Quando torna online
window.addEventListener("online", () => {

    setTimeout(() => {
        startVideo();
    }, 1000);

});

</script>

</body>
</html>
