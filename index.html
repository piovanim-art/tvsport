<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rai Sport Live</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline>
</video>

<script>

const video = document.getElementById("video");

const STREAM =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv";


function playVideo() {

    video.muted = true;

    video.play().catch(function() {
        console.log("Autoplay bloccato");
    });
}


function startStream() {

    /*
     * HLS nativo
     */
    if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = STREAM;

        video.addEventListener("loadedmetadata", function() {
            playVideo();
        }, { once: true });

        return;
    }


    /*
     * Android / Chrome / OptiSigns
     */
    if (window.Hls && Hls.isSupported()) {

        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 30,
            maxBufferLength: 30
        });

        hls.loadSource(STREAM);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            playVideo();
        });

        hls.on(Hls.Events.ERROR, function(event, data) {

            console.log("HLS:", data);

            if (data.fatal) {

                hls.destroy();

                setTimeout(function() {
                    location.reload();
                }, 5000);
            }

        });

    }

}


/* Avvio */
startStream();


/*
 * Se OptiSigns mette il video in pausa,
 * proviamo automaticamente a ripartire.
 */
setInterval(function() {

    if (video.paused) {
        playVideo();
    }

}, 3000);


/*
 * Se il video finisce o perde il collegamento
 */
video.addEventListener("ended", function() {
    location.reload();
});

</script>

</body>
</html>
