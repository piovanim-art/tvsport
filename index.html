<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Rai Sport Live</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;
    background: #000;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;

    object-fit: contain;

    display: block;

    border: 0;
    outline: 0;
}

</style>

<!-- HLS.JS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>

</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
</video>

<script>

/*
===========================================================
RAI SPORT LIVE
===========================================================
*/

const STREAM =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv.m3u8";


const video = document.getElementById("video");

let hls = null;
let retryTimer = null;


/*
===========================================================
PLAY
===========================================================
*/

function playVideo() {

    video.muted = true;
    video.volume = 0;

    video.play()
        .then(function() {

            console.log("RAI Sport: PLAY OK");

        })
        .catch(function(error) {

            console.log(
                "Autoplay non riuscito:",
                error
            );

            /*
             * Secondo tentativo
             */

            setTimeout(function() {

                video.muted = true;
                video.volume = 0;

                video.play().catch(function() {});

            }, 1000);

        });
}


/*
===========================================================
AVVIO STREAM
===========================================================
*/

function startStream() {

    console.log("Avvio Rai Sport");


    /*
     * Elimina eventuale player precedente
     */

    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;
    }


    /*
     * Reset video
     */

    try {
        video.pause();
    } catch (e) {}

    video.removeAttribute("src");

    video.load();


    /*
     * =======================================================
     * HLS NATIVO
     * =======================================================
     */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        console.log("Utilizzo HLS nativo");


        video.src = STREAM;


        video.addEventListener(
            "loadedmetadata",
            function() {

                console.log(
                    "Metadata caricati"
                );

                playVideo();

            },
            { once: true }
        );


        video.addEventListener(
            "canplay",
            function() {

                playVideo();

            },
            { once: true }
        );


        return;
    }


    /*
     * =======================================================
     * HLS.JS
     * =======================================================
     */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        console.log(
            "Utilizzo HLS.js"
        );


        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: false,

            backBufferLength: 30,

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 6,

            manifestLoadingMaxRetry: 6,

            manifestLoadingRetryDelay: 2000,

            levelLoadingMaxRetry: 6,

            levelLoadingRetryDelay: 2000,

            fragLoadingMaxRetry: 6,

            fragLoadingRetryDelay: 2000

        });


        /*
         * Carica stream
         */

        hls.loadSource(STREAM);


        /*
         * Collega HLS al video
         */

        hls.attachMedia(video);


        /*
         * ===================================================
         * MANIFEST CARICATO
         * ===================================================
         */

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                console.log(
                    "Manifest Rai Sport caricato"
                );

                video.muted = true;
                video.volume = 0;

                playVideo();

            }
        );


        /*
         * ===================================================
         * CAN PLAY
         * ===================================================
         */

        hls.on(
            Hls.Events.FRAG_LOADED,
            function() {

                if (video.paused) {

                    playVideo();

                }

            }
        );


        /*
         * ===================================================
         * ERRORI
         * ===================================================
         */

        hls.on(
            Hls.Events.ERROR,
            function(event, data) {

                console.log(
                    "HLS ERROR:",
                    data.type,
                    data.details,
                    data.fatal
                );


                /*
                 * Errore di rete
                 */

                if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    console.log(
                        "Errore rete - riavvio"
                    );

                    restartStream();

                }


                /*
                 * Errore media
                 */

                else if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    console.log(
                        "Errore media - recovery"
                    );

                    try {

                        hls.recoverMediaError();

                    } catch (e) {

                        restartStream();

                    }

                }


                /*
                 * Altri errori fatali
                 */

                else if (data.fatal) {

                    console.log(
                        "Errore HLS fatale"
                    );

                    restartStream();

                }

            }
        );

    }


    /*
     * =======================================================
     * NESSUN SUPPORTO
     * =======================================================
     */

    else {

        console.log(
            "Browser senza supporto HLS"
        );

        restartStream();

    }

}


/*
===========================================================
RIAVVIO STREAM
===========================================================
*/

function restartStream() {

    clearTimeout(retryTimer);


    retryTimer = setTimeout(
        function() {

            console.log(
                "Riconnessione Rai Sport..."
            );

            startStream();

        },
        5000
    );

}


/*
===========================================================
VIDEO BLOCCATO
===========================================================
*/

video.addEventListener(
    "stalled",
    function() {

        console.log(
            "Stream stalled"
        );

        setTimeout(
            function() {

                if (
                    video.paused ||
                    video.readyState < 2
                ) {

                    restartStream();

                }

            },
            5000
        );

    }
);


/*
===========================================================
VIDEO FINITO
===========================================================
*/

video.addEventListener(
    "ended",
    function() {

        console.log(
            "Stream terminato"
        );

        restartStream();

    }
);


/*
===========================================================
ERRORE VIDEO
===========================================================
*/

video.addEventListener(
    "error",
    function() {

        console.log(
            "Errore video"
        );

        restartStream();

    }
);


/*
===========================================================
WATCHDOG
===========================================================
*/

setInterval(
    function() {

        /*
         * Se il video è in pausa
         */

        if (video.paused) {

            console.log(
                "Watchdog: video in pausa"
            );

            playVideo();

        }

    },
    5000
);


/*
===========================================================
CONTROLLO STREAM
===========================================================
*/

setInterval(
    function() {

        /*
         * Se il video non ha ancora iniziato
         * a ricevere dati, riprova.
         */

        if (
            video.readyState === 0
        ) {

            console.log(
                "Watchdog: nessun dato"
            );

        }

    },
    15000
);


/*
===========================================================
AVVIO
===========================================================
*/

window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                startStream();

            },
            500
        );

    }
);


/*
===========================================================
RIAVVIO QUANDO LA PAGINA TORNA ATTIVA
===========================================================
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (!document.hidden) {

            setTimeout(
                function() {

                    if (video.paused) {

                        playVideo();

                    }

                },
                1000
            );

        }

    }
);

</script>

</body>
</html>
