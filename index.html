<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rai Sport Live</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}

body {

    position: fixed;

    inset: 0;

}

#frame {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    border: 0;

    background: #000;

}

</style>

</head>

<body>

<iframe
    id="frame"
    src="https://www.raiplay.it/dirette/raisport"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    scrolling="no">
</iframe>


<script>

/*
====================================================
RAI SPORT LIVE
Virgin Active - OptiSigns
====================================================
*/


const frame = document.getElementById("frame");


/*
----------------------------------------------------
Ricarica periodica di sicurezza
----------------------------------------------------
*/

const RELOAD_INTERVAL = 30 * 60 * 1000;


setTimeout(function () {

    location.reload();

}, RELOAD_INTERVAL);


/*
----------------------------------------------------
Se OptiSigns/Android mette la pagina in background,
ricarichiamo il frame quando torna visibile.
----------------------------------------------------
*/

document.addEventListener(
    "visibilitychange",
    function () {

        if (!document.hidden) {

            setTimeout(function () {

                frame.src =
                    "https://www.raiplay.it/dirette/raisport";

            }, 1000);

        }

    }
);


/*
----------------------------------------------------
Gestione errore iframe
----------------------------------------------------
*/

frame.addEventListener(
    "error",
    function () {

        setTimeout(function () {

            location.reload();

        }, 5000);

    }
);

</script>

</body>
</html>
