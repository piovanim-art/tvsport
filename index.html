<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Rai Sport Live</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
    }

    #status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 22px;
        text-align: center;
        z-index: 10;
        display: none;
    }
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    controls="false">
</video>

<div id="status">Caricamento Rai Sport...</div>

<!-- HLS.JS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

/*
    STREAM RAI SPORT
*/
const streamUrl =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=";


/*
    NASCONDI MESSAGGIO
*/
function hideStatus() {
    status.style.display = "none";
}


/*
    MOSTRA MESSAGGIO
*/
function showStatus(text) {
    status.innerHTML = text;
    status.style.display = "block";
}


/*
    AVVIO PLAYER
*/
function startPlayer() {

    showStatus("Caricamento Rai Sport...");

    /*
        CASO 1:
        HLS.JS disponibile
    */
    if (window.Hls && Hls.isSupported()) {

        const hls = new Hls({
            enableWorker: false,

            /*
                Impostazioni più conservative
                per Android/WebView/OptiSigns
            */
            lowLatencyMode: false,
            backBufferLength: 30,
            maxBufferLength: 30,

            manifestLoadingMaxRetry: 5,
            manifestLoadingRetryDelay: 2000,

            levelLoadingMaxRetry: 5,
            levelLoadingRetryDelay: 2000,

            fragLoadingMaxRetry: 5,
            fragLoadingRetryDelay: 2000
        });

        hls.loadSource(streamUrl);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {

            hideStatus();

            video.muted = true;

            const playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.catch(function () {
                    /*
                        Alcuni dispositivi bloccano
                        l'autoplay.
                    */
                    video.muted = true;
                    video.play().catch(() => {});
                });
            }
        });


        hls.on(Hls.Events.ERROR, function(event, data) {

            console.log(
                "HLS ERROR:",
                data.type,
                data.details,
                data.fatal
            );

            if (data.fatal) {

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                    console.log("Tentativo recupero rete...");

                    hls.startLoad();

                } else if (
                    data.type === Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    console.log("Tentativo recupero media...");

                    hls.recoverMediaError();

                } else {

                    /*
                        Riavvio completo dopo errore grave
                    */
                    setTimeout(function () {
                        location.reload();
                    }, 5000);
                }
            }
        });

        return;
    }


    /*
        CASO 2:
        Browser con HLS nativo
        (Safari / alcuni Smart TV)
    */
    if (
        video.canPlayType("application/vnd.apple.mpegurl") ||
        video.canPlayType("application/x-mpegURL")
    ) {

        video.src = streamUrl;

        video.muted = true;

        video.addEventListener("loadedmetadata", function () {

            hideStatus();

            video.play().catch(() => {});

        });

        return;
    }


    /*
        NESSUN SUPPORTO
    */
    showStatus(
        "Il dispositivo non supporta la riproduzione HLS."
    );
}


/*
    AVVIO
*/
startPlayer();


/*
    SE IL VIDEO SI FERMA,
    PROVA A RIPARTIRE
*/
video.addEventListener("pause", function () {

    setTimeout(function () {

        if (video.paused) {
            video.play().catch(() => {});
        }

    }, 1500);

});


/*
    SE FINISCE / SI BLOCCA
*/
video.addEventListener("stalled", function () {

    console.log("Stream stalled");

    setTimeout(function () {

        video.play().catch(() => {});

    }, 3000);

});

</script>

</body>
</html>
