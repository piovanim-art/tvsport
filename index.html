<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Virgin Active - Sportitalia Live</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SPORTITALIA
   ===================================================== */

#sportitalia {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    z-index: 1;
}


/* =====================================================
   PAGINA ORARIO
   ===================================================== */

#clock {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    z-index: 10;

    opacity: 1;

    transition: opacity 0.8s ease;
}

</style>

</head>

<body>


<!-- =====================================================
     SPORTITALIA
     
     QUESTO È LO STESSO LINK CHE FUNZIONAVA PRIMA.
     ===================================================== -->

<iframe
    id="sportitalia"
    src="https://sportitalialive.it/sihd/"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>


<!-- =====================================================
     OROLOGIO VIRGIN ACTIVE
     
     VIENE MOSTRATO SOPRA SPORTITALIA
     ===================================================== -->

<iframe
    id="clock"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<script>

/* =====================================================
   OROLOGIO VISIBILE PER 15 SECONDI
   ===================================================== */

const clock = document.getElementById("clock");


setTimeout(function () {

    /*
     * Dissolvenza dell'orologio
     */

    clock.style.opacity = "0";


    /*
     * Dopo la dissolvenza lo eliminiamo
     */

    setTimeout(function () {

        clock.style.display = "none";

    }, 800);


}, 15000);


/* =====================================================
   RICARICA AUTOMATICA OGNI 6 ORE
   ===================================================== */

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/* =====================================================
   SE LA PAGINA PRINCIPALE HA UN ERRORE,
   PROVA A RICARICARLA
   ===================================================== */

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>

</body>
</html>
