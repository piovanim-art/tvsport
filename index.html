<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rai Sport Live</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100vw;
    height: 100vh;
    background: #000;
    object-fit: contain;
    display: block;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    controls="false">
</video>

<script>

(function () {

    const video = document.getElementById("video");

    /*
     * Rai Sport HD
     *
     * output=16 = stream HLS
     */
    const STREAM =
        "https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=16";

    let hls = null;
    let reconnectTimer = null;
    let started = false;


    /*
     * AVVIO VIDEO
     */
    function forcePlay() {

        video.muted = true;

        const promise = video.play();

        if (promise !== undefined) {

            promise.catch(function () {

                /*
                 * Secondo tentativo
                 */
                setTimeout(function () {

                    video.muted = true;

                    video.play().catch(function () {});

                }, 1000);

            });

        }

    }


    /*
     * RIAVVIO COMPLETO
     */
    function restartStream() {

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
        }

        reconnectTimer = setTimeout(function () {

            location.reload();

        }, 3000);

    }


    /*
     * HLS.JS
     */
    function startHLS() {

        if (!window.Hls || !Hls.isSupported()) {
            return false;
        }

        try {

            hls = new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 10,

                maxBufferLength: 20,

                maxMaxBufferLength: 30,

                liveSyncDurationCount: 3,

                liveMaxLatencyDurationCount: 6,

                manifestLoadingMaxRetry: 3,

                manifestLoadingRetryDelay: 1000,

                levelLoadingMaxRetry: 3,

                levelLoadingRetryDelay: 1000,

                fragLoadingMaxRetry: 3,

                fragLoadingRetryDelay: 1000

            });


            hls.attachMedia(video);


            hls.on(Hls.Events.MEDIA_ATTACHED, function () {

                hls.loadSource(STREAM);

            });


            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                started = true;

                forcePlay();

            });


            hls.on(Hls.Events.FRAG_BUFFERED, function () {

                if (video.paused) {
                    forcePlay();
                }

            });


            hls.on(Hls.Events.ERROR, function (event, data) {

                console.log(
                    "Rai Sport HLS:",
                    data.type,
                    data.details,
                    data.fatal
                );


                if (!data.fatal) {
                    return;
                }


                switch (data.type) {

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.log("Errore rete - recupero");

                        try {
                            hls.startLoad();
                        } catch (e) {
                            restartStream();
                        }

                        break;


                    case Hls.ErrorTypes.MEDIA_ERROR:

                        console.log("Errore media - recupero");

                        try {
                            hls.recoverMediaError();
                        } catch (e) {
                            restartStream();
                        }

                        break;


                    default:

                        try {
                            hls.destroy();
                        } catch (e) {}

                        restartStream();

                        break;

                }

            });


            return true;

        } catch (error) {

            console.log("Errore HLS:", error);

            return false;

        }

    }


    /*
     * HLS NATIVO
     *
     * Alcuni dispositivi Android/TV lo supportano
     */
    function startNative() {

        if (video.canPlayType("application/vnd.apple.mpegurl")) {

            video.src = STREAM;

            video.addEventListener(
                "loadedmetadata",
                function () {

                    started = true;
                    forcePlay();

                },
                { once: true }
            );

            video.addEventListener(
                "canplay",
                function () {

                    forcePlay();

                }
            );

            video.addEventListener(
                "error",
                function () {

                    restartStream();

                }
            );

            return true;
        }

        return false;

    }


    /*
     * NASCONDI CONTROLLI
     */
    video.controls = false;


    /*
     * AVVIO
     */
    if (!startNative()) {
        startHLS();
    }


    /*
     * CONTROLLO AUTOPLAY
     */
    setInterval(function () {

        if (!started) {
            return;
        }

        if (video.paused) {
            forcePlay();
        }

    }, 3000);


    /*
     * CONTROLLO BLOCCO STREAM
     *
     * Se il video rimane fermo a 0 secondi
     * per troppo tempo, ricarica la pagina.
     */
    let lastTime = -1;
    let lastChange = Date.now();


    setInterval(function () {

        const currentTime = video.currentTime;

        if (currentTime !== lastTime) {

            lastTime = currentTime;
            lastChange = Date.now();

            return;
        }


        if (
            started &&
            Date.now() - lastChange > 15000
        ) {

            console.log(
                "Stream fermo - riavvio"
            );

            location.reload();

        }

    }, 5000);


    /*
     * EVENTO FINE VIDEO
     */
    video.addEventListener(
        "ended",
        function () {

            location.reload();

        }
    );


    /*
     * VISIBILITY CHANGE
     *
     * Utile per OptiSigns/Android.
     */
    document.addEventListener(
        "visibilitychange",
        function () {

            if (!document.hidden) {

                setTimeout(function () {
                    forcePlay();
                }, 500);

            }

        }
    );


    /*
     * CLICK / TOUCH
     *
     * Se il dispositivo richiede un'interazione
     * iniziale, il primo touch avvia il video.
     */
    document.addEventListener(
        "click",
        forcePlay,
        { once: true }
    );


    document.addEventListener(
        "touchstart",
        forcePlay,
        { once: true }
    );


})();

</script>

</body>
</html>
