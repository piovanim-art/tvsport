<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Virgin Active - Sportitalia Live TEST</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}


/* =====================================================
   SPORTITALIA
   ===================================================== */

#sportitalia {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

}


/* =====================================================
   OROLOGIO VIRGIN ACTIVE
   ===================================================== */

#clock {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    z-index: 10;

    opacity: 1;

    transition: opacity 0.8s ease;

}

</style>

</head>


<body>


<!-- =====================================================
     SPORTITALIA LIVE
     
     NUOVO STREAM HLS
     ===================================================== -->

<video
    id="sportitalia"
    autoplay
    muted
    playsinline
    controls="false">
</video>


<!-- =====================================================
     OROLOGIO VIRGIN ACTIVE
     ===================================================== -->

<iframe
    id="clock"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<!-- =====================================================
     HLS.JS
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>

/* =====================================================
   SPORTITALIA HLS
   ===================================================== */

const video = document.getElementById("sportitalia");

const stream =
    "https://edge-001.streamup.eu/sportitalia/sihd_abr/playlist.m3u8";


/* =====================================================
   AVVIO STREAM
   ===================================================== */

if (Hls.isSupported()) {

    const hls = new Hls({

        enableWorker: true,

        lowLatencyMode: true,

        backBufferLength: 30

    });


    hls.loadSource(stream);

    hls.attachMedia(video);


    hls.on(Hls.Events.MANIFEST_PARSED, function () {

        video.play().catch(function () {

            console.log("Autoplay bloccato");

        });

    });


    /* =================================================
       RECUPERO AUTOMATICO DA ERRORI HLS
       ================================================= */

    hls.on(Hls.Events.ERROR, function (event, data) {

        console.log("HLS ERROR:", data);


        if (data.fatal) {

            switch (data.type) {

                case Hls.ErrorTypes.NETWORK_ERROR:

                    console.log("Errore rete - riavvio HLS");

                    hls.startLoad();

                    break;


                case Hls.ErrorTypes.MEDIA_ERROR:

                    console.log("Errore media - recupero HLS");

                    hls.recoverMediaError();

                    break;


                default:

                    console.log("Errore HLS fatale");

                    hls.destroy();

                    setTimeout(function () {

                        location.reload();

                    }, 10000);

                    break;

            }

        }

    });

}


/* =====================================================
   SUPPORTO HLS NATIVO
   ===================================================== */

else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = stream;

    video.addEventListener("loadedmetadata", function () {

        video.play();

    });

}


/* =====================================================
   OROLOGIO VISIBILE PER 15 SECONDI
   ===================================================== */

const clock = document.getElementById("clock");


setTimeout(function () {

    clock.style.opacity = "0";


    setTimeout(function () {

        clock.style.display = "none";

    }, 800);


}, 15000);


/* =====================================================
   RICARICA AUTOMATICA OGNI 6 ORE
   ===================================================== */

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/* =====================================================
   RECUPERO GENERALE
   ===================================================== */

window.addEventListener("error", function () {

    setTimeout(function () {

        location.reload();

    }, 10000);

});

</script>


</body>

</html>
