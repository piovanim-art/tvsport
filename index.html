<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Virgin Active - Clock / Sportitalia</title>


<style>

/* =====================================================
   PAGINA
   ===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   IFRAME ORARIO
   ===================================================== */

#clockFrame {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    z-index: 1;

    opacity: 1;
}


/* =====================================================
   IFRAME SPORTITALIA
   ===================================================== */

#sportitaliaFrame {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    z-index: 2;

    opacity: 0;

    transition: opacity 0.8s ease;

    pointer-events: none;
}


/* =====================================================
   SCHERMATA NERA DI TRANSIZIONE
   ===================================================== */

#transitionScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 3;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.8s ease;
}

</style>

</head>


<body>


<!-- =====================================================
     PAGINA ORARIO VIRGIN ACTIVE
     
     QUESTA È LA TUA PAGINA GITHUB GIÀ ESISTENTE
     ===================================================== -->

<iframe
    id="clockFrame"
    src="https://piovanim-art.github.io/oraribrescia/"
    frameborder="0"
    scrolling="no">
</iframe>


<!-- =====================================================
     SPORTITALIA SI-HD
     ===================================================== -->

<iframe
    id="sportitaliaFrame"
    src="https://sportitalialive.it/sihd/"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    frameborder="0"
    scrolling="no">
</iframe>


<!-- =====================================================
     TRANSIZIONE NERA
     ===================================================== -->

<div id="transitionScreen"></div>


<script>

/* =====================================================
   ELEMENTI
   ===================================================== */

const clockFrame =
    document.getElementById("clockFrame");

const sportitaliaFrame =
    document.getElementById("sportitaliaFrame");

const transitionScreen =
    document.getElementById("transitionScreen");


/* =====================================================
   TEMPO ORARIO
   15 SECONDI
   ===================================================== */

const CLOCK_TIME = 15000;


/* =====================================================
   DOPO 15 SECONDI
   PASSIAMO A SPORTITALIA
   ===================================================== */

setTimeout(function () {

    console.log(
        "Virgin Active Clock: fine schermata orario"
    );


    /*
    Mostra Sportitalia
    */

    sportitaliaFrame.style.opacity = "1";

    sportitaliaFrame.style.pointerEvents = "auto";


    /*
    Dissolvenza dell'orario
    */

    clockFrame.style.opacity = "0";


    /*
    Dopo la dissolvenza
    nascondiamo completamente l'orario
    */

    setTimeout(function () {

        clockFrame.style.display = "none";

    }, 800);


}, CLOCK_TIME);


/* =====================================================
   RICARICA AUTOMATICA DOPO 6 ORE
   ===================================================== */

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/* =====================================================
   GESTIONE ERRORI
   ===================================================== */

window.addEventListener(
    "error",
    function () {

        setTimeout(function () {

            location.reload();

        }, 10000);

    }
);

</script>


</body>
</html>
