<!DOCTYPE html>
<html lang="it">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Rai Sport Live</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      object-fit: contain;

      border: 0;
      outline: 0;

      -webkit-user-select: none;
      user-select: none;
    }

  </style>

</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>


  <!-- HLS.JS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>


  <script>

    /*
    =========================================================
    RAI SPORT LIVE
    OTTIMIZZATO PER OPTISIGNS / TV

    AUDIO OFF
    AUTOPLAY
    =========================================================
    */


    /*
    =========================================================
    STREAM RAI SPORT
    =========================================================
    */

    const STREAM_URL =
      "https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv";


    const video =
      document.getElementById("video");


    let hls = null;

    let reconnectTimer = null;

    let playAttempts = 0;


    /*
    =========================================================
    IMPOSTAZIONI VIDEO
    =========================================================
    */

    video.autoplay = true;

    video.muted = true;

    video.defaultMuted = true;

    video.volume = 0;

    video.playsInline = true;

    video.controls = false;


    video.setAttribute("autoplay", "");

    video.setAttribute("muted", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("webkit-playsinline", "");


    /*
    =========================================================
    FUNZIONE PLAY
    =========================================================
    */

    function tryPlay() {

      if (!video) {
        return;
      }


      video.muted = true;

      video.defaultMuted = true;

      video.volume = 0;


      try {

        const promise =
          video.play();


        if (promise !== undefined) {

          promise
            .then(function () {

              console.log(
                "RAI SPORT: PLAY OK"
              );

              playAttempts = 0;

            })
            .catch(function (error) {

              console.log(
                "RAI SPORT: PLAY BLOCCATO",
                error
              );

            });

        }

      } catch (error) {

        console.log(
          "RAI SPORT: errore play",
          error
        );

      }

    }


    /*
    =========================================================
    DISTRUGGI HLS
    =========================================================
    */

    function destroyHLS() {

      if (hls) {

        try {
          hls.destroy();
        } catch (e) {}

        hls = null;

      }

    }


    /*
    =========================================================
    RICONNESSIONE
    =========================================================
    */

    function reconnect() {

      if (reconnectTimer) {
        return;
      }


      console.log(
        "RAI SPORT: riconnessione"
      );


      reconnectTimer =
        setTimeout(function () {

          reconnectTimer = null;

          destroyHLS();

          startStream();

        }, 5000);

    }


    /*
    =========================================================
    HLS.JS
    =========================================================
    */

    function startHLS() {

      destroyHLS();


      hls = new Hls({

        /*
         * Qualità automatica
         */

        startLevel: -1,

        capLevelToPlayerSize: true,


        /*
         * Buffer moderato
         */

        maxBufferLength: 15,

        maxMaxBufferLength: 30,

        backBufferLength: 15,

        maxBufferHole: 0.5,


        /*
         * Prestazioni
         */

        enableWorker: true,

        lowLatencyMode: false,


        /*
         * Retry
         */

        fragLoadingMaxRetry: 6,

        manifestLoadingMaxRetry: 6,

        levelLoadingMaxRetry: 6,


        fragLoadingRetryDelay: 1000,

        manifestLoadingRetryDelay: 1000,

        levelLoadingRetryDelay: 1000,


        /*
         * Timeout
         */

        fragLoadingTimeOut: 10000,

        manifestLoadingTimeOut: 10000,

        levelLoadingTimeOut: 10000

      });


      /*
      =======================================================
      COLLEGA VIDEO
      =======================================================
      */

      hls.attachMedia(video);


      /*
      =======================================================
      PLAYER COLLEGATO
      =======================================================
      */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log(
            "RAI SPORT: player collegato"
          );


          hls.loadSource(
            STREAM_URL
          );

        }
      );


      /*
      =======================================================
      MANIFEST
      =======================================================
      */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log(
            "RAI SPORT: manifest pronto"
          );


          /*
           * Primo tentativo
           */

          tryPlay();


          /*
           * Secondo tentativo
           */

          setTimeout(
            tryPlay,
            500
          );


          /*
           * Terzo tentativo
           */

          setTimeout(
            tryPlay,
            1500
          );


          /*
           * Quarto tentativo
           */

          setTimeout(
            tryPlay,
            3000
          );


          /*
           * Quinto tentativo
           */

          setTimeout(
            tryPlay,
            5000
          );

        }
      );


      /*
      =======================================================
      PRIMO SEGMENTO BUFFERIZZATO
      =======================================================
      */

      hls.on(
        Hls.Events.FRAG_BUFFERED,
        function () {

          if (video.paused) {

            tryPlay();

          }

        }
      );


      /*
      =======================================================
      ERRORI HLS
      =======================================================
      */

      hls.on(
        Hls.Events.ERROR,
        function (
          event,
          data
        ) {

          console.log(
            "RAI SPORT HLS:",
            data.type,
            data.details
          );


          if (!data.fatal) {
            return;
          }


          /*
          ---------------------------------------------------
          NETWORK
          ---------------------------------------------------
          */

          if (
            data.type ===
            Hls.ErrorTypes.NETWORK_ERROR
          ) {

            try {

              hls.startLoad();

              tryPlay();

            } catch (e) {

              reconnect();

            }

            return;
          }


          /*
          ---------------------------------------------------
          MEDIA
          ---------------------------------------------------
          */

          if (
            data.type ===
            Hls.ErrorTypes.MEDIA_ERROR
          ) {

            try {

              hls.recoverMediaError();

              setTimeout(
                tryPlay,
                1000
              );

            } catch (e) {

              reconnect();

            }

            return;
          }


          /*
          ---------------------------------------------------
          ALTRO
          ---------------------------------------------------
          */

          reconnect();

        }
      );

    }


    /*
    =========================================================
    AVVIO STREAM
    =========================================================
    */

    function startStream() {

      destroyHLS();


      /*
      -------------------------------------------------------
      HLS NATIVO
      -------------------------------------------------------
      */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "RAI SPORT: HLS nativo"
        );


        video.src =
          STREAM_URL;


        video.load();


        video.addEventListener(
          "loadedmetadata",
          function nativeMetadata() {

            tryPlay();


            setTimeout(
              tryPlay,
              1000
            );


            setTimeout(
              tryPlay,
              3000
            );


            video.removeEventListener(
              "loadedmetadata",
              nativeMetadata
            );

          }
        );


        return;
      }


      /*
      -------------------------------------------------------
      HLS.JS
      -------------------------------------------------------
      */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        console.log(
          "RAI SPORT: HLS.js"
        );


        startHLS();


        return;
      }


      /*
      -------------------------------------------------------
      NON SUPPORTATO
      -------------------------------------------------------
      */

      console.log(
        "RAI SPORT: HLS non supportato"
      );


      reconnect();

    }


    /*
    =========================================================
    EVENTO PLAYING
    =========================================================
    */

    video.addEventListener(
      "playing",
      function () {

        console.log(
          "RAI SPORT: VIDEO IN RIPRODUZIONE"
        );

        playAttempts = 0;

      }
    );


    /*
    =========================================================
    CAN PLAY
    =========================================================
    */

    video.addEventListener(
      "canplay",
      function () {

        if (video.paused) {

          tryPlay();

        }

      }
    );


    /*
    =========================================================
    PAUSA
    =========================================================
    */

    video.addEventListener(
      "pause",
      function () {

        console.log(
          "RAI SPORT: VIDEO IN PAUSA"
        );


        /*
         * Non ricarichiamo lo stream.
         * Proviamo semplicemente Play.
         */

        setTimeout(
          tryPlay,
          300
        );

        setTimeout(
          tryPlay,
          1000
        );

        setTimeout(
          tryPlay,
          2500
        );

      }
    );


    /*
    =========================================================
    STALLED
    =========================================================
    */

    video.addEventListener(
      "stalled",
      function () {

        console.log(
          "RAI SPORT: STALLED"
        );


        /*
         * Lasciamo alcuni secondi
         * al buffer per recuperare.
         */

        setTimeout(
          function () {

            if (
              video.paused ||
              video.readyState < 3
            ) {

              tryPlay();

            }

          },
          5000
        );

      }
    );


    /*
    =========================================================
    ENDED
    =========================================================
    */

    video.addEventListener(
      "ended",
      function () {

        reconnect();

      }
    );


    /*
    =========================================================
    ERRORE VIDEO
    =========================================================
    */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "RAI SPORT: errore video"
        );


        reconnect();

      }
    );


    /*
    =========================================================
    WATCHDOG
    =========================================================
    */

    setInterval(
      function () {

        /*
         * Audio sempre OFF
         */

        video.muted = true;

        video.defaultMuted = true;

        video.volume = 0;


        /*
         * Se è fermo ma ha già dati,
         * tenta solo il Play.
         */

        if (
          video.paused &&
          video.readyState >= 2
        ) {

          tryPlay();

        }

      },
      5000
    );


    /*
    =========================================================
    AVVIO
    =========================================================
    */

    startStream();

  </script>

</body>

</html>
