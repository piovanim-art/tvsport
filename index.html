<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Rai Sport Live</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

video {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    object-fit: contain;

    border: 0;
    outline: none;
}
</style>

</head>

<body>

<video
    id="raiVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
</video>


<script>

const video = document.getElementById("raiVideo");


/*
====================================================
RAI SPORT HD
====================================================
*/

const RAI_URL =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv";


/*
====================================================
IMPOSTAZIONI VIDEO
====================================================
*/

video.autoplay = true;
video.muted = true;
video.defaultMuted = true;
video.volume = 0;
video.playsInline = true;


/*
====================================================
CARICAMENTO
====================================================
*/

function loadRai() {

    console.log("Caricamento Rai Sport...");

    video.pause();

    video.removeAttribute("src");

    video.load();

    video.src = RAI_URL;

    video.load();

    playVideo();
}


/*
====================================================
PLAY
====================================================
*/

function playVideo() {

    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;

    const promise = video.play();

    if (promise !== undefined) {

        promise.catch(function(error) {

            console.log(
                "Autoplay bloccato:",
                error
            );

            /*
            Secondo tentativo
            */

            setTimeout(function() {

                video.muted = true;

                video.play().catch(function() {});

            }, 1000);

        });

    }
}


/*
====================================================
VIDEO PRONTO
====================================================
*/

video.addEventListener(
    "loadedmetadata",
    function() {

        console.log(
            "Rai Sport: metadata caricati"
        );

        playVideo();

    }
);


video.addEventListener(
    "canplay",
    function() {

        console.log(
            "Rai Sport: canplay"
        );

        playVideo();

    }
);


video.addEventListener(
    "playing",
    function() {

        console.log(
            "Rai Sport: PLAYING"
        );

    }
);


/*
====================================================
SE SI FERMA
====================================================
*/

video.addEventListener(
    "pause",
    function() {

        console.log(
            "Rai Sport: video in pausa"
        );

        setTimeout(function() {

            playVideo();

        }, 1000);

    }
);


/*
====================================================
ERRORE
====================================================
*/

video.addEventListener(
    "error",
    function() {

        console.log(
            "Rai Sport: errore video"
        );

        setTimeout(function() {

            loadRai();

        }, 5000);

    }
);


/*
====================================================
STALL
====================================================
*/

video.addEventListener(
    "stalled",
    function() {

        console.log(
            "Rai Sport: stream stalled"
        );

        setTimeout(function() {

            if (video.paused) {
                loadRai();
            }

        }, 5000);

    }
);


/*
====================================================
WATCHDOG
====================================================
*/

setInterval(function() {

    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;

    if (video.paused) {

        console.log(
            "Watchdog: riavvio video"
        );

        playVideo();

    }

}, 5000);


/*
====================================================
AVVIO
====================================================
*/

loadRai();

</script>

</body>
</html>
