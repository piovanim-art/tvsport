<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Rai Sport Live</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #000;

      object-fit: contain;

      border: 0;
      outline: 0;
    }

  </style>

</head>


<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen"
  ></video>


  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>


  <script>

    /*
    =========================================================
    RAI SPORT LIVE
    Versione iniziale per test PC / OptiSigns

    AUDIO OFF
    AUTOPLAY ON
    =========================================================
    */


    /*
    =========================================================
    URL RAI
    =========================================================
    */

    const STREAM_URL =
      "https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv.m3u8";


    const video =
      document.getElementById("video");


    let hls = null;

    let retryTimer = null;


    /*
    =========================================================
    AUDIO OFF
    =========================================================
    */

    video.muted = true;

    video.volume = 0;

    video.autoplay = true;

    video.playsInline = true;

    video.setAttribute("muted", "");

    video.setAttribute("autoplay", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("webkit-playsinline", "");

    video.controls = false;


    /*
    =========================================================
    AVVIO VIDEO
    =========================================================
    */

    function playVideo() {

      video.muted = true;

      video.volume = 0;


      const promise =
        video.play();


      if (promise !== undefined) {

        promise
          .then(function () {

            console.log(
              "Rai Sport: video avviato"
            );

          })
          .catch(function (error) {

            console.log(
              "Rai Sport: autoplay in attesa",
              error
            );

          });

      }

    }


    /*
    =========================================================
    DISTRUGGI HLS
    =========================================================
    */

    function destroyHLS() {

      if (hls) {

        try {

          hls.destroy();

        } catch (e) {}

        hls = null;

      }

    }


    /*
    =========================================================
    RICONNESSIONE
    =========================================================
    */

    function reconnect() {

      if (retryTimer) {

        return;

      }


      console.log(
        "Rai Sport: riconnessione..."
      );


      retryTimer =
        setTimeout(function () {

          retryTimer = null;

          destroyHLS();

          startStream();

        }, 3000);

    }


    /*
    =========================================================
    HLS.JS
    =========================================================
    */

    function startHLS() {

      destroyHLS();


      hls = new Hls({

        startLevel: -1,

        capLevelToPlayerSize: true,

        maxBufferLength: 10,

        maxMaxBufferLength: 20,

        backBufferLength: 15,

        maxBufferHole: 0.5,

        enableWorker: true,

        fragLoadingMaxRetry: 6,

        manifestLoadingMaxRetry: 6,

        levelLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000,

        manifestLoadingRetryDelay: 1000,

        levelLoadingRetryDelay: 1000,

        fragLoadingTimeOut: 10000,

        manifestLoadingTimeOut: 10000,

        levelLoadingTimeOut: 10000

      });


      /*
      ---------------------------------------------------------
      COLLEGA PLAYER
      ---------------------------------------------------------
      */

      hls.attachMedia(video);


      /*
      ---------------------------------------------------------
      PLAYER COLLEGATO
      ---------------------------------------------------------
      */

      hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function () {

          console.log(
            "Rai Sport: player collegato"
          );


          hls.loadSource(
            STREAM_URL
          );

        }
      );


      /*
      ---------------------------------------------------------
      MANIFEST
      ---------------------------------------------------------
      */

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          console.log(
            "Rai Sport: stream disponibile"
          );


          playVideo();

        }
      );


      /*
      ---------------------------------------------------------
      ERRORI HLS
      ---------------------------------------------------------
      */

      hls.on(
        Hls.Events.ERROR,
        function (
          event,
          data
        ) {

          console.log(
            "Rai Sport HLS:",
            data.type,
            data.details
          );


          if (!data.fatal) {

            return;

          }


          switch (data.type) {

            case Hls.ErrorTypes.NETWORK_ERROR:

              try {

                hls.startLoad();

              } catch (e) {

                reconnect();

              }

              break;


            case Hls.ErrorTypes.MEDIA_ERROR:

              try {

                hls.recoverMediaError();

              } catch (e) {

                reconnect();

              }

              break;


            default:

              reconnect();

              break;

          }

        }
      );

    }


    /*
    =========================================================
    AVVIO STREAM
    =========================================================
    */

    function startStream() {

      destroyHLS();


      /*
      ---------------------------------------------------------
      HLS NATIVO
      ---------------------------------------------------------
      */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        console.log(
          "Rai Sport: HLS nativo"
        );


        video.src =
          STREAM_URL;


        video.load();


        video.addEventListener(
          "loadedmetadata",
          function nativePlay() {

            playVideo();


            video.removeEventListener(
              "loadedmetadata",
              nativePlay
            );

          }
        );


        return;

      }


      /*
      ---------------------------------------------------------
      HLS.JS
      ---------------------------------------------------------
      */

      if (
        window.Hls &&
        Hls.isSupported()
      ) {

        console.log(
          "Rai Sport: HLS.js"
        );


        startHLS();


        return;

      }


      /*
      ---------------------------------------------------------
      NON SUPPORTATO
      ---------------------------------------------------------
      */

      reconnect();

    }


    /*
    =========================================================
    STREAM BLOCCATO
    =========================================================
    */

    video.addEventListener(
      "stalled",
      function () {

        console.log(
          "Rai Sport: stream stalled"
        );


        setTimeout(
          function () {

            if (
              video.paused ||
              video.readyState < 3
            ) {

              reconnect();

            }

          },
          5000
        );

      }
    );


    /*
    =========================================================
    STREAM TERMINATO
    =========================================================
    */

    video.addEventListener(
      "ended",
      function () {

        reconnect();

      }
    );


    /*
    =========================================================
    ERRORE VIDEO
    =========================================================
    */

    video.addEventListener(
      "error",
      function () {

        console.log(
          "Rai Sport: errore video"
        );


        reconnect();

      }
    );


    /*
    =========================================================
    CONTROLLO PERIODICO
    =========================================================
    */

    setInterval(
      function () {

        video.muted = true;

        video.volume = 0;


        if (
          video.paused &&
          video.readyState >= 2
        ) {

          playVideo();

        }

      },
      5000
    );


    /*
    =========================================================
    AVVIO
    =========================================================
    */

    startStream();

  </script>

</body>

</html>
