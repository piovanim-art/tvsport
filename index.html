<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Sportitalia SI-HD Live</title>


<style>

/* =====================================================
   PAGINA
   ===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   SPORTITALIA
   ===================================================== */

iframe {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    background: #000;

    opacity: 0;

    transition: opacity 0.8s ease;
}


/* =====================================================
   SCHERMATA LOGO
   ===================================================== */

#logoScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    opacity: 1;

    transition: opacity 0.8s ease;

    pointer-events: none;
}


/* =====================================================
   LOGO VIRGIN ACTIVE

   NESSUNA ANIMAZIONE
   NESSUN RIDIMENSIONAMENTO
   ===================================================== */

#logo {

    display: block;

    width: auto;
    height: auto;

    max-width: none;
    max-height: none;

    margin: 0;
    padding: 0;

    transform: none;

    animation: none;

    transition: none;
}

</style>

</head>


<body>


<!-- =====================================================
     LOGO VIRGIN ACTIVE
     ===================================================== -->

<div id="logoScreen">

    <img
        id="logo"
        src="logo.png"
        alt="Virgin Active"
    >

</div>


<!-- =====================================================
     SPORTITALIA SI-HD
     ===================================================== -->

<iframe
    id="sportitalia"

    src="https://sportitalialive.it/sihd/"

    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"

    allowfullscreen

    frameborder="0"

    scrolling="no">
</iframe>


<script>

/* =====================================================
   SPORTITALIA SI-HD
   ===================================================== */


/* -----------------------------------------------------
   ELEMENTI
   ----------------------------------------------------- */

const logoScreen =
    document.getElementById("logoScreen");

const sportitalia =
    document.getElementById("sportitalia");


/* -----------------------------------------------------
   QUANDO SPORTITALIA HA CARICATO LA PAGINA
   ----------------------------------------------------- */

sportitalia.addEventListener(
    "load",
    function () {

        console.log(
            "Sportitalia: pagina caricata"
        );


        /*
        Aspettiamo che il browser abbia
        completato il rendering della pagina.
        */

        requestAnimationFrame(function () {

            requestAnimationFrame(function () {

                /*
                Mostra Sportitalia
                */

                sportitalia.style.opacity = "1";


                /*
                Dissolvenza del logo
                */

                logoScreen.style.opacity = "0";


                /*
                Rimuove completamente
                il logo dopo la dissolvenza
                */

                setTimeout(function () {

                    logoScreen.style.display = "none";

                }, 800);

            });

        });

    }
);


/* -----------------------------------------------------
   RICARICA AUTOMATICA DOPO 6 ORE
   ----------------------------------------------------- */

setTimeout(function () {

    location.reload();

}, 6 * 60 * 60 * 1000);


/* -----------------------------------------------------
   GESTIONE ERRORI
   ----------------------------------------------------- */

window.addEventListener(
    "error",
    function () {

        setTimeout(function () {

            location.reload();

        }, 10000);

    }
);

</script>

</body>

</html>
