<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Rai Sport Live</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;

    background: #000;
}

#video {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    object-fit: contain;

    border: 0;
    outline: 0;
}

</style>

</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
</video>


<script>

/* =========================================================
   RAI SPORT LIVE
   Virgin Active / OptiSigns
   ========================================================= */


/*
   URL PRINCIPALE RAI

   HTTPS + output 7
*/
const STREAM =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=raiplayappletv";


/*
   URL ALTERNATIVA
*/
const STREAM_ALT =
"https://mediapolis.rai.it/relinker/relinkerServlet.htm?cont=358025&output=7&forceUserAgent=rainet/4.0.5";


const video = document.getElementById("video");


let currentStream = STREAM;

let lastTime = -1;

let lastProgress = Date.now();

let started = false;

let retryCount = 0;


/* =========================================================
   VIDEO PLAY
   ========================================================= */

function playVideo() {

    video.muted = true;

    video.setAttribute("muted", "");

    video.setAttribute("playsinline", "");

    video.setAttribute("webkit-playsinline", "");


    const promise = video.play();


    if (promise !== undefined) {

        promise.catch(function () {

            setTimeout(function () {

                video.muted = true;

                video.play().catch(function () {});

            }, 1000);

        });

    }

}


/* =========================================================
   CARICAMENTO STREAM
   ========================================================= */

function loadStream(url) {

    currentStream = url;

    started = false;

    lastTime = -1;

    lastProgress = Date.now();


    /*
       Pulizia precedente
    */

    video.pause();

    video.removeAttribute("src");

    video.load();


    /*
       Nuovo stream
    */

    video.src = url;


    /*
       Forziamo il caricamento
    */

    video.load();


    /*
       Tentativi di autoplay
    */

    setTimeout(function () {

        playVideo();

    }, 500);


    setTimeout(function () {

        playVideo();

    }, 2000);


    setTimeout(function () {

        playVideo();

    }, 5000);

}


/* =========================================================
   EVENTI VIDEO
   ========================================================= */

video.addEventListener(
    "loadedmetadata",
    function () {

        started = true;

        playVideo();

    }
);


video.addEventListener(
    "canplay",
    function () {

        started = true;

        playVideo();

    }
);


video.addEventListener(
    "playing",
    function () {

        started = true;

        retryCount = 0;

        lastProgress = Date.now();

    }
);


video.addEventListener(
    "timeupdate",
    function () {

        if (video.currentTime !== lastTime) {

            lastTime = video.currentTime;

            lastProgress = Date.now();

        }

    }
);


/* =========================================================
   ERRORE STREAM
   ========================================================= */

video.addEventListener(
    "error",
    function () {

        console.log(
            "Errore video:",
            video.error
        );


        retryCount++;


        /*
           Primo fallback:
           seconda variante User-Agent
        */

        if (retryCount === 1) {

            setTimeout(function () {

                loadStream(STREAM_ALT);

            }, 2000);

            return;

        }


        /*
           Secondo tentativo:
           URL principale
        */

        if (retryCount === 2) {

            setTimeout(function () {

                loadStream(STREAM);

            }, 3000);

            return;

        }


        /*
           Se continua a non partire,
           ricarichiamo completamente la pagina.
        */

        setTimeout(function () {

            location.reload();

        }, 5000);

    }
);


/* =========================================================
   STREAM TERMINATO
   ========================================================= */

video.addEventListener(
    "ended",
    function () {

        location.reload();

    }
);


/* =========================================================
   CONTROLLO OGNI 5 SECONDI
   ========================================================= */

setInterval(function () {


    /*
       Se è in pausa,
       riproduci
    */

    if (video.paused) {

        playVideo();

    }


    /*
       Se non sta avanzando
    */

    if (
        started &&
        Date.now() - lastProgress > 15000
    ) {

        console.log(
            "Rai Sport bloccato - riavvio"
        );


        video.pause();

        video.load();


        setTimeout(function () {

            loadStream(currentStream);

        }, 1000);

    }


}, 5000);


/* =========================================================
   VISIBILITY
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (!document.hidden) {

            setTimeout(function () {

                playVideo();

            }, 500);

        }

    }
);


/* =========================================================
   AVVIO AUTOMATICO
   ========================================================= */

loadStream(STREAM);


/* =========================================================
   ULTERIORE PROTEZIONE AUTOPLAY
   ========================================================= */

window.addEventListener(
    "load",
    function () {

        setTimeout(function () {

            playVideo();

        }, 1000);

    }
);


/* =========================================================
   SE LA TV RITORNA ONLINE
   ========================================================= */

window.addEventListener(
    "online",
    function () {

        setTimeout(function () {

            loadStream(currentStream);

        }, 1000);

    }
);

</script>

</body>
</html>
